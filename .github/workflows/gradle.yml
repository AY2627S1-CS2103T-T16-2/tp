name: Java CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Run repository-wide tests
        if: runner.os == 'Linux'
        working-directory:  ${{ github.workspace }}/.github
        run: ./run-checks.sh

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk+fx

      - name: Build and check with Gradle on Linux
        if: runner.os == 'Linux'
        env:
          RUN_JAVAFX_TESTS: 'true'
        run: xvfb-run -a ./gradlew check coverage

      - name: Build and check with Gradle on other platforms
        if: runner.os != 'Linux'
        run: ./gradlew check coverage

      - name: Upload coverage reports to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build executable JAR
        if: runner.os == 'Linux'
        run: ./gradlew shadowJar

      - name: Upload executable JAR
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: tuitionbook
          path: build/libs/tuitionbook.jar
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Download executable JAR
        uses: actions/download-artifact@v8
        with:
          name: tuitionbook
          path: build/libs

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG_NAME" build/libs/tuitionbook.jar
          --title "$TAG_NAME"
          --notes-file CHANGELOG.md
          --verify-tag
