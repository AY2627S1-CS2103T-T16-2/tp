plugins {
    id 'java'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '9.5.1'
    id 'application'
    id 'jacoco'
}

application {
    mainClass = 'seedu.tuitionbook.Main'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
}

checkstyle {
    toolVersion = '14.1.0'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

task coverage(type: JacocoReport) {
    dependsOn test
    sourceDirectories.from files(sourceSets.main.allSource.srcDirs)
    classDirectories.from files(sourceSets.main.output)
    executionData.from files(jacocoTestReport.executionData)
    afterEvaluate {
        classDirectories.from files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/*.jar'])
        })
    }
    reports {
        html.required = true
        xml.required = true
    }
}

dependencies {
    String jUnitVersion = '5.14.4'
    String javaFxVersion = '17.0.7'

    implementation "org.openjfx:javafx-base:${javaFxVersion}:win"
    implementation "org.openjfx:javafx-base:${javaFxVersion}:mac"
    implementation "org.openjfx:javafx-base:${javaFxVersion}:linux"
    implementation "org.openjfx:javafx-controls:${javaFxVersion}:win"
    implementation "org.openjfx:javafx-controls:${javaFxVersion}:mac"
    implementation "org.openjfx:javafx-controls:${javaFxVersion}:linux"
    implementation "org.openjfx:javafx-fxml:${javaFxVersion}:win"
    implementation "org.openjfx:javafx-fxml:${javaFxVersion}:mac"
    implementation "org.openjfx:javafx-fxml:${javaFxVersion}:linux"
    implementation "org.openjfx:javafx-graphics:${javaFxVersion}:win"
    implementation "org.openjfx:javafx-graphics:${javaFxVersion}:mac"
    implementation "org.openjfx:javafx-graphics:${javaFxVersion}:linux"

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.7.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.7.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

shadowJar {
    archiveFileName = 'tuitionbook.jar'
}

defaultTasks 'clean', 'test'

version = providers.gradleProperty('appVersion')
        .orElse('0.0.0')
        .get()
tasks.register('printReleaseNotes') {
    group = 'documentation'
    description = 'Prints release notes for the current version.'

    doLast {
        String currentVersion = project.version.toString()
        String changelog = file('CHANGELOG.md').text

        String escapedVersion =
                java.util.regex.Pattern.quote(currentVersion)

        def pattern = ~/(?ms)^## \[${escapedVersion}\] - [^\r\n]+(?:\r?\n).*?(?=^## |\z)/
        def match = pattern.matcher(changelog)

        if (!match.find()) {
            throw new GradleException(
                    "No changelog entry found for version ${currentVersion}"
            )
        }

        println match.group().trim()
    }
}

version = providers.gradleProperty('appVersion')
        .orElse('0.0.0')
        .get()

def generatedVersionDir = layout.buildDirectory.dir('generated/sources/version/main')

tasks.register('generateVersionSource') {
    outputs.dir(generatedVersionDir)

    doLast {
        File outputDir = generatedVersionDir.get().asFile
                .toPath()
                .resolve('seedu/tuitionbook')
                .toFile()

        outputDir.mkdirs()

        new File(outputDir, 'BuildInfo.java').text = """
package seedu.tuitionbook;

/** Contains build metadata generated by Gradle. */
public final class BuildInfo {
    /** The version of the application. */
    public static final String VERSION = "${project.version}";

    /** Prevents instantiation of this utility class. */
    private BuildInfo() {
    }
}
"""
    }
}

sourceSets {
    main {
        java {
            srcDir generatedVersionDir
        }
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('generateVersionSource')
}
